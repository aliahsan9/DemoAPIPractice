name: CI/CD DemoAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DemoAPI/DemoAPI.csproj

      - name: Build
        run: dotnet build DemoAPI/DemoAPI.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test DemoAPI/DemoAPI.csproj --no-build --verbosity normal

      - name: Publish
        run: dotnet publish DemoAPI/DemoAPI.csproj -c Release -o publish

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t demoapi:latest .

      - name: Push Docker image
        run: |
          docker tag demoapi:latest <aliahsan9>/demoapi:latest
          docker push <aliahsan9>/demoapi:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: DemoAPI
          images: <dockerhub-username>/demoapi:latest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}